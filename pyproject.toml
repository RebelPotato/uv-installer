[project]
name = "uv-installer"
version = "0.1.0"
description = "A single-file, offline Windows installer for uv"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pyinstaller==6.22.2", "pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
